name: Dev APK

on:
    push:
        branches:
            - ci-debug-apk

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Java
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml

            - name: Dependencies
              run: flutter pub get

            - name: Build dev apk arm64
              run: flutter build apk --release --target-platform android-arm64 --android-project-arg dev=1

            - name: Upload
              uses: actions/upload-artifact@v7
              with:
                  name: dev-arm64
                  path: build/app/outputs/flutter-apk/app-release.apk
                  if-no-files-found: error
